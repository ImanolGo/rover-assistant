[project]
name = "rover-assistant"
version = "0.1.0"
description = "Single-process Jetson rover assistant (Gemma + YOLO, no ROS2)"
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "pyserial",
    "fastapi",
    "uvicorn",
    "httpx",
    "psutil",
    "pyyaml",
    "sounddevice",
    "soundfile",
    "openwakeword",
    "silero-vad",
    "piper-tts",
    "ultralytics",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black"]
laya = ["laya"]
moonshine = ["moonshine-voice==0.1.5"]

[project.scripts]
rover = "rover.main:main"

[tool.uv]
# Jetson (L4T/JP6): pypi onnxruntime >=1.24 has no cp310 aarch64 wheel; keep <2 numpy
constraint-dependencies = ["onnxruntime<1.24", "numpy<2"]

[tool.uv.sources]
torch = { index = "jetson-cu126" }
torchvision = { index = "jetson-cu126" }

[[tool.uv.index]]
name = "jetson-cu126"
url = "https://pypi.jetson-ai-lab.io/jp6/cu126"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rover"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
