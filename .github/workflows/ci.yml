name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff black pytest
      - run: ruff check src bench
      - run: black --check src bench
      - run: pip install -e . --no-deps && pip install numpy pyyaml pyserial fastapi uvicorn httpx
      - run: pytest -q
